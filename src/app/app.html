<main class="flex h-screen w-screen flex-row overflow-hidden bg-black p-1">
  <app-note-list class="h-full w-65 mr-1" (selected)="updateSelected($event)"></app-note-list>

  <div class="flex flex-col w-full">
    <app-note-header
      class="h-15 w-full mb-1"
      [addForm]="addForm()"
      [selectedNote]="selectedNote()"
      (delete)="clearSelectedNote()"
      (openForm)="openState()"
      (closeForm)="closeState()"
    ></app-note-header>
    <app-note-details
      class="h-full w-full"
      [addForm]="addForm()"
      (state)="closeState()"
      [selectedNote]="selectedNote()"
    ></app-note-details>
  </div>
</main>
