<div class="h-full w-full bg-gray-900 rounded-2xl border-2 border-gray-700 overflow-auto">
  @for (note of service.notes(); track note.id) {
    <article class="m-2 rounded bg-gray-800 p-3 text-white">
      <h2>{{ note.title }}</h2>
      <p>{{ note.content }}</p>
    </article>
  } @empty {
    <p class="text-lg text-white font-semibold">The list is empty</p>
  }
</div>
