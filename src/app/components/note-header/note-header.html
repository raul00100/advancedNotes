<div
  class="flex items-center justify-between px-3 h-full w-full bg-gray-900 rounded-2xl border-2 border-gray-700 text-white"
>
  <button class="text-2xl cursor-pointer hover:scale-115 transition-all mt-1" (click)="open()">
    <ng-icon name="matAddNotesOutline" />
  </button>

  <h1>Note Details</h1>

  @if (addForm) {
    <div>
      <button
        type="submit"
        form="note-details"
        class="bg-red-500 h-9 w-18 rounded-lg cursor-pointer hover:scale-110 active:scale-95 active:bg-red-600 transition-all mr-3"
        (click)="close()"
      >
        Discard
      </button>

      <button
        type="submit"
        form="note-details"
        class="bg-green-500 h-9 w-18 rounded-lg cursor-pointer hover:scale-110 active:scale-95 active:bg-green-600 transition-all"
      >
        Submit
      </button>
    </div>
  } @else if (selectedNote) {
    <button
      (click)="removeNote()"
      class="rounded-lg cursor-pointer w-9 h-9 hover:bg-red-500 text-[22px] hover:scale-110 transition-all active:scale-100 active:bg-red-600"
    >
      <ng-icon name="remixDeleteBin5Line" />
    </button>
  } @else {
    <!-- placeholder to keep the header structure -->
    <div class="w-10 h-10 opacity-0"></div>
  }
</div>
