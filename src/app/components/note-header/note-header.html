<div
  class="flex items-center justify-between relative px-3 h-full w-full bg-gray-900 rounded-2xl border-2 border-gray-700 text-white"
>
  @if (addFormState || editFormState) {
    <div class="w-9"></div>
  } @else {
    <button
      class="flex items-center justify-center rounded-lg cursor-pointer w-9 h-9 hover:bg-green-500 text-[24px] hover:scale-110 transition-all active:scale-100 active:bg-green-600 mr-5"
      (click)="newAddForm()"
    >
      <ng-icon name="matAddNotesOutline" />
    </button>
  }

  @if (addFormState) {
    <h1 class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-lg font-semibold">
      Create a new note
    </h1>
  } @else if (editFormState) {
    <h1 class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-lg font-semibold">
      Editing a note
    </h1>
  } @else {
    <h1 class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-lg font-semibold">
      Note Details
    </h1>
  }

  @if (addFormState) {
    <div>
      <button
        class="bg-red-500 h-9 w-18 rounded-lg cursor-pointer hover:scale-110 active:scale-95 active:bg-red-600 transition-all mr-3"
        (click)="removeAddForm()"
      >
        Discard
      </button>

      <button
        type="submit"
        form="note-details"
        class="bg-green-500 h-9 w-18 rounded-lg cursor-pointer hover:scale-110 active:scale-95 active:bg-green-600 transition-all"
      >
        Submit
      </button>
    </div>
  } @else if (editFormState) {
    <div>
      <button
        class="bg-red-500 h-9 w-18 rounded-lg cursor-pointer hover:scale-110 active:scale-95 active:bg-red-600 transition-all mr-3"
        (click)="removeEditForm()"
      >
        Discard
      </button>

      <button
        type="submit"
        form="note-edit"
        class="bg-green-500 h-9 w-18 rounded-lg cursor-pointer hover:scale-110 active:scale-95 active:bg-green-600 transition-all"
      >
        Submit
      </button>
    </div>
  } @else if (selectedNote) {
    <div class="flex flex-row">
      <button
        class="flex items-center justify-center rounded-lg cursor-pointer w-9 h-9 hover:bg-blue-500 text-[22px] hover:scale-110 transition-all active:scale-100 active:bg-blue-600 mr-5"
        (click)="addEditForm()"
      >
        <ng-icon name="lucideEdit" />
      </button>

      <button
        (click)="removeNote()"
        class="flex items-center justify-center rounded-lg cursor-pointer w-9 h-9 hover:bg-red-500 text-[22px] hover:scale-110 transition-all active:scale-100 active:bg-red-600"
      >
        <ng-icon name="remixDeleteBin5Line" />
      </button>
    </div>
  } @else {
    <!-- placeholder to keep the header structure -->
    <div class="w-10 h-10 opacity-0"></div>
  }
</div>
